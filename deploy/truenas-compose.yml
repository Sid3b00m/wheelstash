# Example Compose file for a TrueNAS SCALE custom app.
# Replace /mnt/POOL/hotwheels with your dataset path. The apps user is usually 568:568.
# Host networking is optional; it makes the published port appear on the TrueNAS host
# (handy if you also run the TrueNAS Tailscale app with host networking).
#
# In the TrueNAS UI: Apps → Discover → Custom App, then paste this YAML
# (or use the equivalent JSON in truenas-app.json with the TrueNAS API).

services:
  hotwheels:
    image: node:22-bookworm-slim
    user: "568:568"
    working_dir: /app
    restart: unless-stopped
    network_mode: host
    command:
      - sh
      - -c
      - |
        set -e
        R=/srv/release/hotwheels-tracker-release.tgz
        if [ -f "$$R" ]; then
          SUM=$$(md5sum < "$$R")
          if [ "$$(cat /app/.release 2>/dev/null)" != "$$SUM" ]; then
            echo Installing release
            find /app -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar xzf "$$R" -C /app
            echo "$$SUM" > /app/.release
          fi
        fi
        cd /app
        exec node server.js
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      TZ: UTC
      REFRESH_ENABLED: "true"
      REFRESH_CRON: "0 6 * * 1"
      REFRESH_FANDOM: "false"
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_VISION_MODEL: qwen2.5vl:7b
      AI_SCAN_ENABLED: "true"
      AI_SCAN_TIMEOUT_MS: "90000"
      DEFAULT_USER_NAME: Collector
    volumes:
      - /mnt/POOL/hotwheels/app:/app
      - /mnt/POOL/hotwheels/storage:/data
      - /mnt/POOL/hotwheels/release:/srv/release:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
