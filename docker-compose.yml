services:
  wheelstash:
    image: wheelstash:local
    build: .
    container_name: wheelstash
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_DIR:-./storage}:/app/storage
    environment:
      PORT: "3000"
      DATA_DIR: /app/storage
      TZ: ${TZ:-UTC}
      REFRESH_ENABLED: ${REFRESH_ENABLED:-true}
      REFRESH_CRON: ${REFRESH_CRON:-0 6 * * 1}
      # Optional AI photo recognition via a local Ollama. Leave OLLAMA_URL empty to disable.
      # If Ollama runs in another Compose service on the same network, use http://ollama:11434
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      AI_SCAN_ENABLED: ${AI_SCAN_ENABLED:-true}
      AI_SCAN_TIMEOUT_MS: ${AI_SCAN_TIMEOUT_MS:-90000}
      DEFAULT_USER_NAME: ${DEFAULT_USER_NAME:-Collector}
    restart: unless-stopped

  # Optional: uncomment and set OLLAMA_URL=http://ollama:11434 on the service above.
  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
